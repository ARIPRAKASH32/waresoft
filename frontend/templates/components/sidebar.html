<aside class="dashboard-sidebar" id="appSidebar">
    <div class="p-3 border-bottom d-flex align-items-center justify-content-between" style="border-color: var(--ws-border-quiet) !important;">
        <div class="d-flex align-items-center gap-2 min-w-0">
            <span class="ws-pill ws-pill-navy" style="font-size: 10px;">DEVNEXUS</span>
            <span class="small ws-text-secondary text-truncate" style="max-width: 118px;">{{ current_user.active_project }}</span>
        </div>
        <button class="btn btn-sm btn-link text-muted d-lg-none p-0" id="sidebarCloseBtn">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <div class="sidebar-scrollable flex-grow-1 overflow-y-auto p-3">
        <!-- Minimalist Unified Workspaces (7 calm links total) -->
        <div class="sidebar-group-title pt-0">Workspaces</div>
        <a href="/admin" class="sidebar-item {% if '/admin' in request.path %}active{% endif %}">
            <i class="bi bi-shield-check"></i>
            <span>Command & Analytics</span>
        </a>
        <a href="/client" class="sidebar-item {% if '/client' in request.path or '/requirements' in request.path or '/quotations' in request.path %}active{% endif %}">
            <i class="bi bi-building"></i>
            <span>Client & Commercial</span>
        </a>
        <a href="/projects" class="sidebar-item {% if '/projects' in request.path %}active{% endif %}">
            <i class="bi bi-kanban"></i>
            <span>Projects & Kanban</span>
        </a>
        <a href="/developer" class="sidebar-item {% if '/developer' in request.path or '/qa' in request.path %}active{% endif %}">
            <i class="bi bi-terminal"></i>
            <span>Engineering & QA</span>
        </a>
        <a href="/operations" class="sidebar-item {% if '/operations' in request.path or '/deployment' in request.path or '/maintenance' in request.path or '/billing' in request.path %}active{% endif %}">
            <i class="bi bi-cloud-check"></i>
            <span>Cloud Ops & Billing</span>
        </a>

        <div class="sidebar-group-title">Preferences</div>
        <a href="/account" class="sidebar-item {% if '/account' in request.path or '/profile' in request.path or '/notifications' in request.path %}active{% endif %}">
            <i class="bi bi-person-gear"></i>
            <span>Account & Alerts</span>
        </a>
        <a href="/" class="sidebar-item">
            <i class="bi bi-arrow-left"></i>
            <span>Public Showcase</span>
        </a>
    </div>

    <div class="p-3 border-top ws-surface-subtle rounded-0 border-start-0 border-end-0 border-bottom-0">
        <div class="d-flex align-items-center justify-content-between ws-text-secondary" style="font-size: 11px;">
            <span class="fw-medium">Cluster SLA</span>
            <span class="fw-semibold" style="color: var(--ws-signal-success);"><i class="bi bi-circle-fill" style="font-size: 7px;"></i> 99.98% OK</span>
        </div>
        <div class="progress mt-2" style="height: 4px; background-color: var(--ws-border-quiet);">
            <div class="progress-bar" style="width: 82%; background-color: var(--ws-brand-blue);"></div>
        </div>
    </div>
</aside>
