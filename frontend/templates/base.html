<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="theme-color" content="#F4F7FB">
    <meta name="description" content="WareSoft DevNexus - Enterprise Software Services & Project Delivery Platform">
    
    <title>{% if title %}{{ title }} | {% endif %}{{ app_name }} DevNexus</title>
    
    <!-- Professional Typography: Inter (UI) & JetBrains Mono (Data/Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Bootstrap 5 CSS (Base Grid & Reset) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
    <!-- WareSoft Design System Tokens & Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    
    {% block head %}{% endblock %}
</head>
<body class="waresoft-body {% block body_class %}{% endblock %}">

    <!-- Global Toast Container -->
    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;"></div>

    {% block layout %}
    <div class="app-viewport">
        {% include 'components/navbar.html' %}
        
        <main class="main-content-flow" id="main-content">
            {% block content %}{% endblock %}
        </main>
        
        {% include 'components/footer.html' %}
    </div>
    {% endblock %}

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Three.js for 3D Visuals & Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Central API & Interaction Handlers -->
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/3d-visualizer.js') }}"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
