{% extends 'base.html' %}

{% block content %}
<div class="content-container py-5 d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 160px);">
    <div class="ws-card p-4 p-md-5" style="width: 100%; max-width: 440px;">
        <div class="text-center mb-4">
            <h2 class="ws-text-ink fs-4 fw-semibold mb-1">Reset Password</h2>
            <p class="text-secondary small">Enter your verified email to receive a recovery token</p>
        </div>

        <form id="forgotForm" onsubmit="handleForgotSubmit(event)">
            <div class="ws-form-group">
                <label class="ws-label" for="resetEmail">Email Address</label>
                <input type="email" class="ws-input" id="resetEmail" placeholder="name@company.com" required>
            </div>

            <button type="submit" class="ws-btn ws-btn-primary w-100" id="resetSubmitBtn">
                <i class="bi bi-key"></i> Dispatch Recovery Link
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-light-subtle">
            <a href="/login" class="small ws-text-cyan text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function handleForgotSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('resetSubmitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Dispatching...';

        setTimeout(() => {
            WareSoftAPI.showToast('Recovery instructions dispatched to your inbox.', 'success');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-key"></i> Dispatch Recovery Link';
            document.getElementById('forgotForm').reset();
        }, 800);
    }
</script>
{% endblock %}
