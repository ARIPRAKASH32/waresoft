{% extends 'base.html' %}

{% block content %}
<div class="content-container py-5 d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 160px);">
    <div class="ws-card p-4 p-md-5" style="width: 100%; max-width: 520px;">
        <div class="text-center mb-4">
            <h2 class="text-white fs-4 fw-semibold mb-1">Create DevNexus Account</h2>
            <p class="text-secondary small">Join your engineering cluster or register as a client</p>
        </div>

        <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="ws-label" for="regName">Full Legal Name</label>
                    <input type="text" class="ws-input" id="regName" placeholder="Ari Prakash" required>
                </div>
                <div class="col-md-6">
                    <label class="ws-label" for="regOrg">Organization</label>
                    <input type="text" class="ws-input" id="regOrg" placeholder="e.g. Acme Labs" required>
                </div>
                <div class="col-12">
                    <label class="ws-label" for="regEmail">Corporate Work Email</label>
                    <input type="email" class="ws-input" id="regEmail" placeholder="ari@acme.com" required>
                </div>
                <div class="col-md-6">
                    <label class="ws-label" for="regRole">Primary Role</label>
                    <select class="ws-select" id="regRole">
                        <option value="client">Client Representative</option>
                        <option value="developer" selected>Software Engineer</option>
                        <option value="qa">QA / Automation Engineer</option>
                        <option value="admin">Engineering Manager</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="ws-label" for="regPassword">Master Password</label>
                    <input type="password" class="ws-input" id="regPassword" placeholder="Min. 8 characters" required minlength="8">
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input bg-dark border-secondary" type="checkbox" id="regAgree" required>
                        <label class="form-check-label text-secondary small" for="regAgree" style="font-size: 11px;">
                            I accept the WareSoft Master Services Agreement and Privacy Policy.
                        </label>
                    </div>
                </div>
                <div class="col-12 pt-2">
                    <button type="submit" class="ws-btn ws-btn-primary w-100" id="regSubmitBtn">
                        <i class="bi bi-person-plus"></i> Initialize Account
                    </button>
                </div>
            </div>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-10">
            <span class="text-secondary small">Already have platform credentials?</span>
            <a href="/login" class="small text-info text-decoration-none ms-1">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function handleRegisterSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('regSubmitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Provisioning...';

        setTimeout(() => {
            WareSoftAPI.showToast('Account successfully provisioned. Redirecting to login...', 'success');
            setTimeout(() => window.location.href = '/login', 600);
        }, 800);
    }
</script>
{% endblock %}
